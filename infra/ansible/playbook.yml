---
- name: Configure AgriOps Droplet
  hosts: agriops
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Upgrade all packages
      apt:
        upgrade: dist

    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - ufw
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Create deploy user
      user:
        name: deployer
        groups: docker
        shell: /bin/bash
        append: yes

    - name: Allow deployer sudo without password
      lineinfile:
        path: /etc/sudoers.d/deployer
        line: "deployer ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: '0440'

    - name: Copy SSH key to deployer
      authorized_key:
        user: deployer
        key: "{{ lookup('file', '~/.ssh/agriops_do.pub') }}"

    - name: Configure UFW - allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Configure UFW - allow HTTP
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Configure UFW - allow HTTPS
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Create app directory
      file:
        path: /opt/agriops
        state: directory
        owner: deployer
        group: deployer
        mode: '0755'
